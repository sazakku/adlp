<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eres la mejor Abogada del Mundo</title>
<meta name="description" content="Una playa pixel al amanecer, un gato y un mensaje en seis idiomas.">
<meta name="theme-color" content="#9fb3ee">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 5 4' shape-rendering='crispEdges'%3E%3Cpath fill='%23e8687a' d='M0 0h2v1h1V0h2v2H4v1H3v1H2V3H1V2H0z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fb3ee}
  body{font-family:'Silkscreen','DotGothic16',monospace;color:#3b2f4a}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
      padding:max(6vh,24px) 16px max(5vh,calc(env(safe-area-inset-bottom) + 20px));pointer-events:none}
  .sign{pointer-events:none;max-width:min(92vw,720px);text-align:center;background:#fffaf0;color:#3b2f4a;
      border:4px solid #3b2f4a;box-shadow:0 0 0 4px #fffaf0,0 0 0 8px #3b2f4a,8px 10px 0 6px rgba(59,47,74,.28);
      padding:14px 22px 10px;font-size:clamp(17px,3.6vw,34px);line-height:1.25;
      opacity:0;transform:translateY(-14px) scale(.7);transition:transform .32s steps(5),opacity .12s}
  .sign.show{opacity:1;transform:none}
  .sign[lang="ja"] .txt{font-family:'DotGothic16',monospace}
  .sign .lg{display:block;margin-top:8px;font-size:.45em;letter-spacing:.12em;color:#8a86b8}
  button{pointer-events:auto;font:700 clamp(15px,2.6vw,22px)/1 'Silkscreen',monospace;color:#3b2f4a;background:#ffe29a;
      border:4px solid #3b2f4a;padding:14px 22px;cursor:pointer;border-radius:0;
      box-shadow:inset -4px -4px 0 #f0b85f,inset 4px 4px 0 #fff4c9,6px 6px 0 #3b2f4a;-webkit-tap-highlight-color:transparent}
  button:hover{background:#ffeab3}
  button:active{transform:translate(4px,4px);box-shadow:inset -4px -4px 0 #f0b85f,inset 4px 4px 0 #fff4c9,2px 2px 0 #3b2f4a}
  button:focus-visible{outline:4px dashed #fffaf0;outline-offset:6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="ui">
  <div class="sign" id="sign" role="status" aria-live="polite"><span class="txt"></span><span class="lg"></span></div>
  <button id="btn" type="button">Pulsa aquí</button>
</div>
<h1 class="sr">Eres la mejor Abogada del Mundo</h1>

<script>
/* ===== Mensajes ===== */
const PHRASES=[
  ['en','English','You are the best lawyer in the world'],
  ['pt','Português','Você é a melhor advogada do mundo'],
  ['de','Deutsch','Du bist die beste Anwältin der Welt'],
  ['it','Italiano','Sei la migliore avvocata del mondo'],
  ['fr','Français','Tu es la meilleure avocate du monde'],
  ['ja','日本語','あなたは世界一の弁護士です'],
];

/* ===== Utilidades pixel ===== */
const cv=document.getElementById('scene'),c=cv.getContext('2d');
let W,H,HOR,SHORE,stat,SX;
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function px(g,x,y,col,w=1,h=1){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function grad(g,stops,y0,y1){const n=stops.length-1;for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,y1-y0-1)*n;const i=Math.min(Math.floor(t),n-1);const f=t-i;
  let run=0,prev=null;for(let x=0;x<=W;x++){const col=x<W?((f>(BAYER[y&3][x&3]+.5)/16)?stops[i+1]:stops[i]):null;
    if(col!==prev){if(prev)px(g,x-run,y,prev,run,1);prev=col;run=0;}run++;}}}
function disc(g,cx,cy,r,col){for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));px(g,cx-w,cy+y,col,2*w+1,1);}}
function speckle(g,y0,y1,col,n,seed){for(let i=0;i<n;i++)px(g,Math.floor(hash(i+seed)*W),y0+Math.floor(hash(i*3+seed)*(y1-y0)),col);}

/* ===== Escena: Amanecer pastel ===== */
function layout(){
  const a=innerWidth/innerHeight;
  if(a>=1){H=180;W=Math.round(H*a);}else{W=200;H=Math.round(W/a);}
  HOR=Math.round(H*(a>=1?.56:.6));SHORE=Math.round(H*(a>=1?.77:.75));
  cv.width=W;cv.height=H;SX=W/320;
  stat=document.createElement('canvas');stat.width=W;stat.height=H;drawStatic(stat.getContext('2d'));
}
function lighthouseX(){return W-Math.max(30,Math.round(40*SX));}
function drawStatic(g){
  grad(g,['#9fb3ee','#b9bcf0','#d3c6ef','#ffd9c0','#fff1d6'],0,HOR);
  const sx=Math.round(W/2);disc(g,sx,HOR+4,25,'#fff0d4');disc(g,sx,HOR+4,20,'#fffaf0');
  grad(g,['#a6ddd4','#8fd0cc','#9ee2d6'],HOR,SHORE);px(g,sx-40,HOR,'#fffaf0',80,1);
  grad(g,['#ffe9c9','#f6d6ab'],SHORE,H);speckle(g,SHORE+6,H,'#e8c18f',Math.round(W*(H-SHORE)/40),17);speckle(g,SHORE+6,H,'#fff6e2',Math.round(W*(H-SHORE)/70),29);
  // rocas y faro
  const lx=lighthouseX(),by=HOR+10;
  disc(g,lx-2,by+4,15,'#8a86b8');disc(g,lx+15,by+8,12,'#77739f');disc(g,lx-18,by+9,9,'#9894c6');px(g,lx-8,by-6,'#a9a5d6',6,2);
  for(let y=by-52;y<by;y++){const k=(y-(by-52))/52,w=Math.round(8+k*6);px(g,lx-w/2,y,Math.floor(k*6.5)%2?'#e8687a':'#ffffff',w,1);px(g,lx+w/2-2,y,'rgba(90,86,128,.25)',2,1);}
  px(g,lx-6,by-54,'#5a5680',12,2);px(g,lx-4,by-60,'#5a5680',1,6);px(g,lx+3,by-60,'#5a5680',1,6);px(g,lx-5,by-63,'#5a5680',10,3);px(g,lx-3,by-65,'#5a5680',6,2);
  // conchas y estrellas de mar
  [[.12,.55,'#f7a8a0'],[.62,.35,'#ffffff'],[.74,.8,'#c9b6ff'],[.45,.9,'#f7c08a']].forEach(([fx,fy,col],i)=>{
    const x=Math.round(fx*W),y=Math.round(SHORE+10+fy*(H-SHORE-14));
    if(i%2){px(g,x,y,col,1,1);px(g,x-2,y+1,col,5,1);px(g,x-1,y+2,col,3,1);px(g,x-2,y+3,col,1,1);px(g,x+2,y+3,col,1,1);}
    else{px(g,x-1,y,col,4,1);px(g,x-2,y+1,col,6,2);px(g,x-2,y+2,'#d98a86',6,1);}});
}
function cloud(g,x,y,col,sh){disc(g,x,y,5,col);disc(g,x+8,y-3,7,col);disc(g,x+17,y-1,6,col);disc(g,x+24,y+1,4,col);px(g,x-4,y+3,sh,33,2);}
function sparkle(g,t,col,n,seed){for(let i=0;i<n;i++){const y=HOR+3+Math.floor(hash(i+seed)*(SHORE-HOR-6));const d=(y-HOR)/(SHORE-HOR);
  const x=((hash(i*7+seed)*(W+20)+t*(4+d*10))%(W+20))-10;if(Math.sin(t*2.2+i*1.7)>-.2)px(g,x,y,col,2+Math.floor(d*6),1);}}
function reflect(g,cx,t,col,wmax,rows){for(let y=HOR+1;y<HOR+rows;y+=2){const k=(y-HOR)/rows;const w=wmax*(1-k*.8)*(.55+.45*Math.sin(t*3+y*.7));
  px(g,cx-w/2+Math.sin(t*1.4+y*.35)*2,y,col,Math.max(1,w),1);}}
function shore(g,t){for(let x=0;x<W;x++){const yf=Math.round(SHORE+3+Math.sin(t*.9)*2.5+Math.sin(x*.07+t*1.3)*1.5);
  px(g,x,SHORE,'#bdeee3',1,yf-SHORE);px(g,x,yf,'#ffffff');if((x+Math.floor(t*5))%6<2)px(g,x,yf-1,'#ffffff');px(g,x,yf+1,'#ecc795',1,2);}}
function boat(g,x,y){const h='#6f6aa0';px(g,x,y,h,12,2);px(g,x+2,y+2,h,8,1);px(g,x+5,y-11,h,1,11);for(let i=0;i<10;i++)px(g,x+6,y-10+i,'#ffffff',Math.floor(i*.55)+1,1);}
function gull(g,x,y,t,ph){const up=Math.floor(t*3+ph)%2,col='#6f6aa0';px(g,x-3,y+(up?0:1),col,2,1);px(g,x+2,y+(up?0:1),col,2,1);px(g,x-1,y+(up?1:0),col,3,1);}

/* ===== El gato (se dibuja pixel a pixel desde formas) ===== */
const CW=46,CH=36,CATCOL={o:'#1f1b2b',w:'#ffffff',s:'#dcd9ea',b:'#2e2a3b',e:'#7cc96e',p:'#f3a3b3',h:'#bdb8d2'};
function inE(x,y,cx,cy,rx,ry){const dx=(x-cx)/rx,dy=(y-cy)/ry;return dx*dx+dy*dy<=1;}
function inT(x,y,a,b,d){const s=(p,q,r)=>(p[0]-r[0])*(q[1]-r[1])-(q[0]-r[0])*(p[1]-r[1]);const P=[x,y],d1=s(P,a,b),d2=s(P,b,d),d3=s(P,d,a);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));}
function dSeg(x,y,a,b){const vx=b[0]-a[0],vy=b[1]-a[1];const t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/(vx*vx+vy*vy)));return Math.hypot(x-a[0]-t*vx,y-a[1]-t*vy);}
const catCache={};
function catGrid(phase,blink,happy){
  const key=phase+'|'+blink+'|'+happy;if(catCache[key])return catCache[key];
  const sw=Math.sin(phase/8*Math.PI*2);
  const tail=[[9,30],[3.5,26],[1.8+sw*1.2,19],[3+sw*2.6,12.5],[6+sw*3.4,9]];
  const G=[];
  for(let y=0;y<CH;y++){const row=[];for(let x=0;x<CW;x++){const X=x+.5,Y=y+.5;let v='.';
    const body=inE(X,Y,18,26,13,8.6)||inE(X,Y,27,21,7.6,11)||inE(X,Y,32,12,8.6,7.3)||inT(X,Y,[24.6,8.5],[26.4,.2],[31.6,5])||inT(X,Y,[32.6,5],[38,.2],[39.8,8.8])
      ||(X>=24.5&&X<=28.8&&Y>=24&&Y<=34.6)||(X>=30.2&&X<=34.4&&Y>=24&&Y<=34.6);
    let tl=false;for(let i=0;i<tail.length-1;i++)if(dSeg(X,Y,tail[i],tail[i+1])<1.75){tl=true;break;}
    if(body){v='w';if(inE(X,Y,15,21,7.4,5.2)||inE(X,Y,26.6,5.4,4.6,4.4)||inE(X,Y,8.5,28.5,3.8,2.6))v='b';
      else if(inT(X,Y,[34.2,5.6],[37.4,2.2],[38.6,7.4]))v='p';else if(Y>=31.5&&X<24||(X>36&&Y>15.6&&inE(X,Y,32,12,8.6,7.3)&&Y<=18))v='s';}
    else if(tl)v='b';
    row.push(v);}G.push(row);}
  // contorno
  const O=G.map(r=>r.slice());
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){if(G[y][x]!=='.')continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>G[y+dy]&&G[y+dy][x+dx]&&G[y+dy][x+dx]!=='.'))O[y][x]='o';}
  const set=(x,y,v)=>{if(O[y]&&O[y][x]!==undefined)O[y][x]=v;};
  for(let y=28;y<35;y++)set(29,y,'o');           // separación de patas
  set(26,34,'o');set(32,34,'o');                  // dedos
  // cara
  if(happy){[[30,11],[31,10],[32,11],[35,11],[36,10],[37,11]].forEach(([x,y])=>set(x,y,'o'));}
  else if(blink){for(let x=30;x<=32;x++)set(x,11,'o');for(let x=35;x<=37;x++)set(x,11,'o');}
  else{set(30,10,'e');set(31,10,'o');set(30,11,'e');set(31,11,'o');set(35,10,'e');set(36,10,'o');set(35,11,'e');set(36,11,'o');}
  set(38,14,'p');set(37,15,'o');set(39,15,'o');
  set(42,13,'h');set(43,12,'h');set(42,15,'h');set(43,16,'h');
  return catCache[key]=O;
}
function drawCat(g,x,base,t,jump,happy){
  const y=Math.round(base-CH-jump);
  const sw=12+Math.round(Math.max(0,10-jump)*.8);px(g,x+26-sw/2+(jump>2?4:0),base-1,'#e3c093',sw+16,2);
  const G=catGrid(Math.floor(t*5)%8,(t%4.3)<.14,happy);
  for(let r=0;r<CH;r++){let run=0,prev='.';for(let k=0;k<=CW;k++){const v=k<CW?G[r][k]:'.';
    if(v!==prev){if(prev!=='.')px(g,x+k-run,y+r,CATCOL[prev],run,1);prev=v;run=0;}run++;}}
}

/* ===== Corazones ===== */
const HEART=['.x.x.','xxxxx','.xxx.','..x..'];let hearts=[];
function spawnHearts(x,y,t){for(let i=0;i<5;i++)hearts.push({x:x+Math.random()*30-8,y:y-Math.random()*6,t0:t+i*.08,vx:(Math.random()-.5)*6,col:i%2?'#e8687a':'#f7a8a0'});}
function drawHearts(g,t){hearts=hearts.filter(h=>t-h.t0<1.8);hearts.forEach(h=>{const a=t-h.t0;if(a<0)return;
  const x=h.x+h.vx*a+Math.sin(a*5)*2,y=h.y-a*22;HEART.forEach((row,r)=>{for(let k=0;k<5;k++)if(row[k]==='x')px(g,x+k,y+r,h.col);});});}

/* ===== Animación ===== */
let jump0=-9;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ms){
  const t=reduce?3:ms/1000;
  c.drawImage(stat,0,0);
  const nC=Math.max(2,Math.round(W/110));
  for(let i=0;i<nC;i++){const sp=2+i%3;cloud(c,((hash(i+3)*W+t*sp)%(W+60))-30,Math.round(10+hash(i+9)*(HOR*.45)),'#ffffff','#e7e0ff');}
  gull(c,((W*.3-t*9)%(W+30)+W+30)%(W+30)-15,Math.round(HOR*.35),t,0);gull(c,((W*.3+12-t*9)%(W+30)+W+30)%(W+30)-15,Math.round(HOR*.35)+5,t,1);
  reflect(c,Math.round(W/2),t,'#fffaf0',46,30);sparkle(c,t,'#e8fffa',Math.round(W/10),41);
  boat(c,W-((t*4)%(W+40))+20,HOR-1);
  shore(c,t);
  const lx=lighthouseX(),by=HOR+10;
  if(Math.sin(t*2.2)>0){px(c,lx-3,by-59,'#fff3a6',6,5);px(c,lx-16,by-58,'#fff8c9',11,1);px(c,lx+5,by-58,'#fff8c9',11,1);}else px(c,lx-3,by-59,'#e6d27a',6,5);
  const dt=ms/1000-jump0,j=dt<.6&&!reduce?Math.sin(dt/.6*Math.PI)*16:0;
  const catX=Math.round(W*(W>H?.26:.12)),base=Math.round(SHORE+(H-SHORE)*.55);
  drawCat(c,catX,base,t,j,dt<1.4);
  drawHearts(c,t);
  if(!reduce)requestAnimationFrame(frame);
}
layout();requestAnimationFrame(frame);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();if(reduce)frame(0);},120);});

/* ===== Botón y letrero ===== */
const sign=document.getElementById('sign'),btn=document.getElementById('btn');let idx=-1;
btn.addEventListener('click',()=>{
  idx=(idx+1)%PHRASES.length;const [lang,name,txt]=PHRASES[idx];
  sign.classList.remove('show');void sign.offsetWidth;
  sign.lang=lang;sign.querySelector('.txt').textContent=txt;sign.querySelector('.lg').textContent=name;
  sign.classList.add('show');btn.textContent='Otra vez';
  const t=performance.now()/1000;jump0=t;
  const catX=Math.round(W*(W>H?.26:.12)),base=Math.round(SHORE+(H-SHORE)*.55);spawnHearts(catX+22,base-CH-6,t);
  if(reduce)frame(0);
});
</script>
</body>
</html>
